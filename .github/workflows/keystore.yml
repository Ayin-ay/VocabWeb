name: 生成签名用的 keystore

# 只跑一次：出来的 keystore + keystore-info.txt 从 artifact 下载，
# 按里面的说明填成仓库 secret，之后所有 APK 都用同一把签名，才能覆盖安装。

on:
  workflow_dispatch:
    inputs:
      alias:
        description: key 的别名
        default: vocab
        type: string

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 生成 keystore
        run: |
          set -euo pipefail
          STORE=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-20)
          KEY=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-20)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE" -keypass "$KEY" \
            -dname "CN=VocabWeb, O=VocabWeb, C=CN"
          base64 -w0 release.keystore > release.keystore.base64
          {
            echo "别名的值：${{ inputs.alias }}"
            echo "ANDROID_KEYSTORE_BASE64 = release.keystore.base64 这个文件的内容（一整行，别换行）"
            echo "ANDROID_KEYSTORE_PASSWORD = $STORE"
            echo "ANDROID_KEY_PASSWORD = $KEY"
            echo "ANDROID_KEY_ALIAS = ${{ inputs.alias }}"
            echo ""
            echo "把这四个填进 Settings → Secrets and variables → Actions，然后删掉本 artifact。"
            echo "keystore 丢了以后装的包只能卸载重装，进度会没，务必自己留一份 release.keystore。"
          } > keystore-info.txt
          cat keystore-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            release.keystore
            release.keystore.base64
            keystore-info.txt
          retention-days: 7
