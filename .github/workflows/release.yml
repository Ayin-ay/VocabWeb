name: 打包并发布安卓 APK

# 跑之前需要五个 secret：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（由「生成签名用的 keystore」那条工作流产出），
# 外加 PUBLISH_APK_TOKEN（一个只能写 APK_REPO 那个公开仓库的 fine-grained PAT）。
# 版本号取 package.json，先跑这条工作流出包，再把 public/app.json 发布到站点，
# 顺序反了的话 App 会提示有新包却下不到对应版本。
#
# 源码仓库是私有的，Release 故意发到公开仓库：私有仓库的下载地址要点开的人登录 GitHub，
# 没被邀请的人直接 404。公开仓库那边只有一枚 APK，词库和源码留在私库里。

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 这版改了啥（写进 Release 说明和 App 里的提醒）
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APK_REPO: Ayin-ay/vocab-sprint-apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 装 Android SDK 组件
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - run: npm ci

      - name: 站点自检 + 构建
        run: |
          npm run smoke
          npm run build

      - name: 同步进安卓工程
        run: npx cap sync android

      - name: 取出 keystore
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$B64" ]; then
            echo "缺少 secret ANDROID_KEYSTORE_BASE64：先跑「生成签名用的 keystore」" >&2
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "APK_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "APK_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APK_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APK_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: gradle 打包
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 收 APK
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "没找到 $src，八成是没签名（AGP 会输出 app-release-unsigned.apk）" >&2
            ls -l android/app/build/outputs/apk/release/ >&2 || true
            exit 1
          fi
          mkdir -p apk
          cp "$src" apk/vocab-sprint.apk
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs apk/vocab-sprint.apk | head -3

      - name: 把 APK 发到公开仓库
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_APK_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "缺少 secret PUBLISH_APK_TOKEN：在 $APK_REPO 建一个 fine-grained PAT（只勾这一个仓库、Contents: Read and write），填进本仓库的 Secrets 后重跑" >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          body="词汇冲刺 $version
          
          $NOTES
          
          直接覆盖安装即可，进度不会动；先卸载再装会清掉这台设备上的记录。
          装完第一次打开请在「设置 → 存档码」里贴一次浏览器导出的存档码。"
          if gh release view "$tag" --repo "$APK_REPO" > /dev/null 2>&1; then
            gh release upload "$tag" apk/vocab-sprint.apk --clobber --repo "$APK_REPO"
            gh release edit "$tag" --notes "$body" --repo "$APK_REPO"
          else
            gh release create "$tag" apk/vocab-sprint.apk --repo "$APK_REPO" --title "词汇冲刺 $tag" --notes "$body" --latest
          fi
          echo "下载地址：https://github.com/$APK_REPO/releases/latest/download/vocab-sprint.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/vocab-sprint.apk
          retention-days: 30
