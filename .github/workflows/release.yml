name: 打包并发布安卓 APK

# 跑之前需要四个 secret：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（由「生成签名用的 keystore」那条工作流产出）。
# 版本号取 package.json，先跑这条工作流出包，再把 public/app.json 发布到站点，
# 顺序反了的话 App 会提示有新包却下不到对应版本。
#
# 仓库是公开的，所以 Release 下载地址任何人点开就能下、不用登录（私有仓库反过来：owner 也要先登录，
# 没被邀请的人直接 404）。公开代价是词库和脚本一起见光——里面没有任何凭据，模型 key 只存在各人浏览器。

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 这版改了啥（写进 Release 说明和 App 里的提醒）
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 装 Android SDK
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/android-sdk"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          mkdir -p "$root/cmdline-tools"
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
          mv "$RUNNER_TEMP/clt/cmdline-tools" "$root/cmdline-tools/latest"
          sdk="$root/cmdline-tools/latest/bin/sdkmanager"
          export ANDROID_HOME="$root"
          yes | "$sdk" --licenses > /dev/null 2>&1 || true
          "$sdk" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # AGP 找 SDK 先看 local.properties，写死省得它只认环境变量
          echo "sdk.dir=$root" > android/local.properties

      - run: npm ci

      - name: 站点自检 + 构建
        run: |
          npm run smoke
          npm run build

      - name: 同步进安卓工程
        run: npx cap sync android

      - name: 取出 keystore
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$B64" ]; then
            echo "缺少 secret ANDROID_KEYSTORE_BASE64：先跑「生成签名用的 keystore」" >&2
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "APK_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "APK_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APK_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APK_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: gradle 打包
        run: |
          set -uo pipefail
          chmod +x android/gradlew
          cd android
          if ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            exit 0
          fi
          {
            echo "### gradle 失败摘要"
            echo ""
            echo '```'
            grep -nE "FAILURE:|What went wrong|> Task .*FAILED|^Caused by|^e: |error:|Could not|Execution failed" "$RUNNER_TEMP/gradle.log" | head -30
            echo "----- 末尾 40 行 -----"
            tail -40 "$RUNNER_TEMP/gradle.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 收 APK
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "没找到 $src，八成是没签名（AGP 会输出 app-release-unsigned.apk）" >&2
            ls -l android/app/build/outputs/apk/release/ >&2 || true
            exit 1
          fi
          mkdir -p apk
          cp "$src" apk/vocab-sprint.apk
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs apk/vocab-sprint.apk | head -3

      - name: 建 Release 并传 APK
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          body="词汇冲刺 $version

          $NOTES

          直接覆盖安装即可，进度不会动；先卸载再装会清掉这台设备上的记录。
          装完第一次打开：先在浏览器「设置 → 学习数据 → 导出全部进度」存一个 .json，再到 App 里同位置「导入并覆盖」。"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" apk/vocab-sprint.apk --clobber
            gh release edit "$tag" --notes "$body"
          else
            gh release create "$tag" apk/vocab-sprint.apk --title "词汇冲刺 $tag" --notes "$body" --latest
          fi
          echo "下载地址：https://github.com/${{ github.repository }}/releases/latest/download/vocab-sprint.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/vocab-sprint.apk
          retention-days: 30
